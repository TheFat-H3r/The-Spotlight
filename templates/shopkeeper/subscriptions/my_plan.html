{% extends "shopkeeper/base.html" %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<h4 class="mb-4">{{ page_title }}</h4>
<div class="card col-md-6">
  <div class="card-body">
    <span class="badge bg-primary mb-2">Active Plan</span>
    <h5>{{ subscription.plan.name|default:"Pro Merchant Plan" }}</h5>
    <p class="text-body-secondary mb-3">Next billing date: {{ subscription.renews_at|date:"M d, Y" }}</p>
    <a href="{% url 'shopkeeper:available_plans' %}" class="btn btn-outline-primary">Change Plan</a>
  </div>
</div>
{% endblock %}
