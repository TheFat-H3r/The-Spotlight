{% extends "shopkeeper/base.html" %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<h4 class="mb-4">{{ page_title }}</h4>
{% for item in announcements %}
<div class="card mb-3">
  <div class="card-body">
    <div class="d-flex justify-content-between">
      <h5 class="card-title">{{ item.title }}</h5>
      <small class="text-body-secondary">{{ item.published_at|date:"M d, Y" }}</small>
    </div>
    <p class="card-text">{{ item.body }}</p>
  </div>
</div>
{% empty %}
<div class="card card-body text-center text-body-secondary">No platform announcements.</div>
{% endfor %}
{% endblock %}
