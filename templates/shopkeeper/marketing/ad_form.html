{% extends "shopkeeper/base.html" %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<h4 class="mb-4">{{ page_title }}</h4>
<div class="card col-md-8">
  <div class="card-body">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Campaign Title</label>
        <input type="text" name="title" class="form-control" required>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Ad Placement</label>
          <select name="placement" class="form-select">
            <option value="homepage_banner">Homepage Banner</option>
            <option value="category_top">Category Top Spot</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Total Budget ($)</label>
          <input type="number" step="0.01" name="budget" class="form-control" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Banner Creative</label>
        <input type="file" name="banner" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary">Submit Campaign</button>
    </form>
  </div>
</div>
{% endblock %}
