{% extends "shopkeeper/base.html" %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="mb-0">{{ page_title }}</h4>
  <select class="form-select w-auto">
    <option>Last 7 Days</option>
    <option selected>Last 30 Days</option>
    <option>This Year</option>
  </select>
</div>

<div class="row g-3 mb-4">
  <div class="col-md-4">
    <div class="card">
      <div class="card-body">
        <div class="text-body-secondary small">Total Revenue</div>
        <h3 class="mt-1 mb-0">${{ total_revenue }}</h3>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card">
      <div class="card-body">
        <div class="text-body-secondary small">Completed Orders / Bookings</div>
        <h3 class="mt-1 mb-0">{{ total_orders_or_bookings }}</h3>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card">
      <div class="card-body">
        <div class="text-body-secondary small">Conversion Rate</div>
        <h3 class="mt-1 mb-0">{{ conversion_rate }}</h3>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-header">Revenue Trend</div>
  <div class="card-body">
    <canvas id="revenueChart" height="100"></canvas>
  </div>
</div>
{% endblock %}
