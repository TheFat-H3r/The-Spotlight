{% extends "shopkeeper/base.html" %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<h4 class="mb-4">{{ page_title }}</h4>
<div class="card">
  <div class="card-body">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Service Title</label>
          <input type="text" name="title" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Service Category</label>
          <select name="category" class="form-select"></select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Price</label>
          <input type="number" step="0.01" name="price" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Duration (Minutes)</label>
          <input type="number" name="duration_minutes" class="form-control" value="60" required>
        </div>
        <div class="col-12">
          <label class="form-label">Service Description</label>
          <textarea name="description" rows="3" class="form-control"></textarea>
        </div>
      </div>
      <button type="submit" class="btn btn-primary mt-4">Save Service</button>
    </form>
  </div>
</div>
{% endblock %}
