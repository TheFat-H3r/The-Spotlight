{% extends "shopkeeper/base.html" %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<h4 class="mb-4">{{ page_title }}</h4>
<div class="card">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <table class="table align-middle">
        <thead><tr><th>Day</th><th>Open</th><th>Opening Time</th><th>Closing Time</th></tr></thead>
        <tbody>
          {% for day in days_of_week %}
          <tr>
            <td>{{ day }}</td>
            <td><input type="checkbox" name="open_{{ day }}" class="form-check-input" checked></td>
            <td><input type="time" name="start_{{ day }}" value="09:00" class="form-control form-control-sm"></td>
            <td><input type="time" name="end_{{ day }}" value="17:00" class="form-control form-control-sm"></td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
      <button type="submit" class="btn btn-primary">Save Working Hours</button>
    </form>
  </div>
</div>
{% endblock %}
